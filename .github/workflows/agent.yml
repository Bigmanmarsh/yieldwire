name: yieldwire-agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yieldwire
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run agent (fetch → deterministic engine → alerts → public history)
        run: node src/run.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE: ${{ secrets.SITE_BASE }}

      - name: Commit public history (append-only, timestamped by GitHub)
        run: |
          git config user.name "yieldwire[bot]"
          git config user.email "yieldwire-agent@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "agent run #${GITHUB_RUN_NUMBER} · $(date -u +%H:%M:%S)Z"
          git push
