on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yieldwire
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run agent (fetch → deterministic engine → alerts → public history)
        run: node src/run.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE: ${{ secrets.SITE_BASE }}

      - name: Commit public history (append-only, timestamped by GitHub)
        run: |
          git config user.name "yieldwire[bot]"
          git config user.email "yieldwire-agent@users.noreply.github.com"
          echo "── before ── HEAD=$(git rev-parse HEAD)"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes this run — nothing to commit"
          else
            git commit -m "agent run #${GITHUB_RUN_NUMBER} · $(date -u +%H:%M:%S)Z"
            echo "committed $(git rev-parse HEAD)"
          fi
          # explicit refspec: checkout@v4 leaves HEAD detached, where a bare
          # `git push` is refused by modern git
          git push origin HEAD:main
          echo "── after ── origin/main now at: $(git ls-remote origin refs/heads/main | cut -c1-7)"
